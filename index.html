// Seule précaution : les entretiens restés non envoyés sur ce téléphone partent d'abord vers la base (3 s au plus).
(function () {
  var TRACKER = 'https://btl-africa.pages.dev/BTL-Vodacom-privileg-tracker/';
  var URL = 'https://upkzlppvwckriuidnyvq.supabase.co/rest/v1/rpc/survey_submit_public';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVwa3pscHB2d2Nrcml1aWRueXZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NjUyNTIsImV4cCI6MjEwMTM0MTI1Mn0.DhGB5MFdRyOeJw0qL297r4NAG5vbAbVpdz18H-d-LnY';
  var go = function () { location.replace(TRACKER); };
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (list) { list.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  var records = [];
  try { records = (JSON.parse(localStorage.getItem('exeter-records')) || []).filter(function (r) { return r && r.status !== 'sent' && r.answers; }); } catch (e) {}
  if (!records.length || !window.fetch || navigator.onLine === false) { go(); return; }
  setTimeout(go, 3000);
  Promise.all(records.map(function (r) {
    return fetch(URL, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify({ p_campaign_code: 'survey-exeter', p_id: r.id, p_answers: r.answers, p_device_created_at: r.createdAt }) })
      .then(function (res) { if (res.ok) r.status = 'sent'; }).catch(function () {});
  })).then(function () {
    try { var all = JSON.parse(localStorage.getItem('exeter-records')) || []; all.forEach(function (x) { records.forEach(function (r) { if (r.id === x.id && r.status === 'sent') x.status = 'sent'; }); }); localStorage.setItem('exeter-records', JSON.stringify(all)); } catch (e) {}
    go();
  });
})();
</script></head>
